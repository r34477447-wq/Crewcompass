<title>CrewCompass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* CrewCompass design tokens: deep-space palette, shared with the pitch deck. */
:root {
  --bg-0: #070d19;
  --bg-1: #0e1626;
  --bg-2: #14213d;
  --panel: rgba(22, 35, 58, 0.78);
  --panel-solid: #16233a;
  --line: #2b3d5c;
  --line-soft: #1f2f4a;
  --text: #e8edf3;
  --text-dim: #b8c4d6;
  --text-mute: #8fa0b8;
  --teal: #4fd1c5;
  --amber: #f2a33a;
  --red: #ff7a85;
  --blue: #7aa7ff;
  --ok: var(--teal);
  --watch: var(--amber);
  --alert: #ff9b54;
  --escalate: var(--red);
  --calibrating: var(--blue);
  color-scheme: dark;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html { background: #070d19; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(79, 209, 197, 0.10), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(122, 167, 255, 0.10), transparent 60%),
    linear-gradient(180deg, var(--bg-0), var(--bg-1));
  background-attachment: fixed;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
a { color: var(--teal); }
h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 600; }
p { margin: 0; }
code, .mono { font-family: var(--mono); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.app { position: relative; z-index: 1; display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

.sidebar {
  position: sticky; top: 0; height: 100vh; padding: 24px 16px;
  display: flex; flex-direction: column; gap: 24px;
  background: linear-gradient(180deg, rgba(7, 13, 25, 0.92), rgba(14, 22, 38, 0.92));
  border-right: 1px solid var(--line-soft);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; text-decoration: none; color: var(--text); }
.brand svg { width: 36px; height: 36px; flex: none; }
.brand b { font-size: 18px; letter-spacing: 0.2px; display: block; }
.brand small { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: var(--teal); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--text-dim); text-decoration: none; font-size: 15px; border: 1px solid transparent;
}
.nav a svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav a:hover { background: rgba(79, 209, 197, 0.06); color: var(--text); }
.nav a[aria-current="page"] { background: rgba(79, 209, 197, 0.12); border-color: rgba(79, 209, 197, 0.35); color: var(--text); }
.sidebar .foot { margin-top: auto; font-size: 12px; color: var(--text-mute); padding: 0 8px; display: grid; gap: 8px; }
.conn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 1px; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); }
.conn.off i { background: var(--amber); box-shadow: 0 0 10px var(--amber); }

.main { padding: 28px 36px 72px; max-width: 1280px; width: 100%; }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.topbar h1 { font-size: 30px; }
.topbar p { color: var(--text-mute); margin-top: 4px; font-size: 15px; }
.clock { font-family: var(--mono); font-size: 12px; letter-spacing: 1px; color: var(--text-mute); text-align: right; }
.clock b { display: block; color: var(--text); font-size: 15px; font-weight: 500; }

.banner {
  display: flex; gap: 12px; align-items: center; padding: 12px 16px; margin-bottom: 20px;
  border: 1px dashed rgba(242, 163, 58, 0.55); border-radius: var(--radius-sm);
  background: rgba(242, 163, 58, 0.07); color: var(--text-dim); font-size: 14px;
}
.banner b { color: var(--amber); font-family: var(--mono); letter-spacing: 1.5px; font-size: 12px; }

.grid { display: grid; gap: 20px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.hero { grid-template-columns: 1.1fr 1.4fr; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.spread { justify-content: space-between; }

.tabbar { display: none; }

@media (max-width: 1100px) {
  .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.hero, .grid.cols-3 { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 20px 16px 96px; }
  .grid.cols-2, .grid.cols-4 { grid-template-columns: 1fr; }
  .topbar h1 { font-size: 24px; }
  .tabbar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; overflow-x: auto;
    background: rgba(7, 13, 25, 0.96); border-top: 1px solid var(--line-soft); padding: 6px 8px;
    gap: 4px; backdrop-filter: blur(8px);
  }
  .tabbar a {
    flex: 1 0 auto; min-width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 8px; color: var(--text-mute); text-decoration: none; font-size: 11px; border-radius: 10px;
  }
  .tabbar a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar a[aria-current="page"] { color: var(--teal); background: rgba(79, 209, 197, 0.1); }
}

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; box-shadow: var(--shadow); backdrop-filter: blur(6px); min-width: 0;
}
.card > h2, .card .card-title { font-size: 16px; letter-spacing: 0.2px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 2.5px; color: var(--amber); text-transform: uppercase; }
.muted { color: var(--text-mute); }
.dim { color: var(--text-dim); }
.small { font-size: 13px; }

/* buttons */
.btn {
  font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; padding: 9px 16px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); color: var(--text);
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
}
.btn:hover { border-color: var(--teal); background: rgba(79, 209, 197, 0.08); }
.btn.primary { background: var(--teal); color: #05222a; border-color: var(--teal); font-weight: 600; }
.btn.primary:hover { background: #7de3da; }
.btn.amber { border-color: rgba(242, 163, 58, 0.6); color: var(--amber); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.ghost { border-color: transparent; }

/* pills */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 999px; font-size: 12px;
  font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; border: 1px solid currentColor; white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.normal, .pill.nominal { color: var(--ok); }
.pill.watch { color: var(--watch); }
.pill.alert, .pill.above_guidance { color: var(--alert); }
.pill.escalate, .pill.above_limit { color: var(--escalate); }
.pill.calibrating, .pill.insufficient, .pill.no_data { color: var(--calibrating); }
.pill.alert::before, .pill.above_guidance::before { border-radius: 2px; transform: rotate(45deg); }
.pill.escalate::before, .pill.above_limit::before { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }

/* crew cards */
.crew-card { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; border-left: 4px solid var(--line); }
.crew-card:hover { border-color: var(--teal); }
.crew-card.watch { border-left-color: var(--watch); }
.crew-card.alert { border-left-color: var(--alert); }
.crew-card.escalate { border-left-color: var(--escalate); }
.crew-card.normal { border-left-color: var(--ok); }
.crew-card.calibrating { border-left-color: var(--calibrating); }
.crew-card .name { font-size: 18px; font-weight: 600; }
.crew-card .role { font-size: 13px; color: var(--text-mute); }
.crew-card .reason { font-size: 14px; color: var(--text-dim); min-height: 42px; }

/* gauge */
.gauge { display: grid; gap: 14px; }
.gauge .big { font-size: 46px; font-weight: 600; letter-spacing: -1px; line-height: 1; }
.gauge .big small { font-size: 16px; color: var(--text-mute); font-weight: 400; margin-left: 6px; letter-spacing: 0; }
.gauge-bar { position: relative; height: 14px; border-radius: 999px; background: linear-gradient(90deg, rgba(79,209,197,.35), rgba(242,163,58,.35) 66%, rgba(255,122,133,.45)); }
.gauge-bar .tick { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--text-mute); }
.gauge-bar .tick span { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--text-mute); white-space: nowrap; }
.gauge-bar .needle { position: absolute; top: -8px; width: 4px; height: 30px; border-radius: 2px; background: var(--text); box-shadow: 0 0 12px rgba(255,255,255,.7); transform: translateX(-50%); }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
.kv div { background: rgba(255,255,255,.03); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 10px 12px; }
.kv b { display: block; font-size: 20px; font-weight: 600; }
.kv span { font-size: 12px; color: var(--text-mute); }

/* tables */
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: left; font-weight: 500; color: var(--text-mute); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.data td { padding: 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; }

/* z strip */
.zstrip { display: inline-flex; gap: 3px; align-items: flex-end; height: 26px; }
.zstrip i { display: block; width: 10px; border-radius: 2px; background: var(--teal); min-height: 3px; }
.zstrip i.bad { background: var(--alert); }

/* forms */
.field { display: grid; gap: 8px; }
.field label, .label { font-size: 15px; font-weight: 500; display: flex; justify-content: space-between; }
.field output { font-family: var(--mono); color: var(--teal); }
input[type="range"] { width: 100%; accent-color: var(--teal); height: 28px; }
select, input[type="file"] {
  font: inherit; color: var(--text); background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 12px;
}
.scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-mute); }
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.moods button {
  font: inherit; cursor: pointer; padding: 12px 4px; border-radius: var(--radius-sm); background: rgba(255,255,255,.03);
  border: 1px solid var(--line); color: var(--text); display: grid; gap: 4px; justify-items: center; font-size: 12px;
}
.moods button b { font-size: 22px; }
.moods button[aria-pressed="true"] { border-color: var(--teal); background: rgba(79,209,197,.14); }

.steps { display: flex; gap: 8px; margin-bottom: 20px; }
.steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--line-soft); }
.steps span.done { background: var(--teal); }
.steps span.now { background: var(--amber); }
.timer { font-family: var(--mono); color: var(--text-mute); font-size: 13px; }

.rt-pad {
  display: grid; place-items: center; text-align: center; min-height: 240px; border-radius: var(--radius); cursor: pointer;
  border: 2px dashed var(--line); background: rgba(255,255,255,.02); user-select: none; padding: 16px; font-size: 22px; font-weight: 500;
}
.rt-pad.wait { background: rgba(255, 122, 133, 0.12); border-color: var(--red); }
.rt-pad.go { background: rgba(79, 209, 197, 0.35); border-color: var(--teal); color: #fff; }
.rt-pad small { display: block; font-size: 14px; color: var(--text-dim); font-weight: 400; margin-top: 6px; }
.dots { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--teal); }

/* tabs (crew selector) */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.tabs a, .tabs button {
  font: inherit; font-size: 14px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
  color: var(--text-dim); text-decoration: none; cursor: pointer;
}
.tabs [aria-current="true"], .tabs [aria-pressed="true"] { background: rgba(79, 209, 197, .14); border-color: var(--teal); color: var(--text); }

/* insights */
.finding { display: grid; gap: 10px; }
.finding h3 { font-size: 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.finding .stmt { color: var(--text-dim); font-size: 14px; }
.conf { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); }
.conf.medium { color: var(--teal); border-color: var(--teal); }
.conf.low { color: var(--amber); border-color: var(--amber); }
.conf.none { color: var(--text-mute); }
.action { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; background: rgba(79,209,197,.05); }
.action h3 { font-size: 17px; margin-bottom: 4px; }
.action .why { color: var(--text-dim); font-size: 14px; margin-bottom: 10px; }
.action ol { margin: 0 0 12px; padding-left: 20px; color: var(--text); font-size: 14px; display: grid; gap: 4px; }
.action .esc { font-size: 13px; color: var(--amber); border-top: 1px solid var(--line-soft); padding-top: 10px; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--text-mute); font-family: var(--mono); font-size: 14px; }
.chart .grid-line { stroke: var(--line-soft); stroke-width: 1; }
.chart .axis { stroke: var(--line); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); margin-top: 8px; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

pre.digest { white-space: pre-wrap; font-family: var(--mono); font-size: 13px; line-height: 1.6; color: var(--text-dim); background: rgba(0,0,0,.25); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 18px; margin: 0; }

.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 170px 1fr 64px; gap: 12px; align-items: center; font-size: 14px; }
.bar-track { height: 14px; border-radius: 7px; background: var(--line-soft); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 7px; background: var(--teal); }
.bar-fill.amber { background: var(--amber); }

.toast { position: fixed; right: 20px; bottom: 24px; z-index: 20; background: var(--panel-solid); border: 1px solid var(--teal); border-radius: var(--radius-sm); padding: 12px 18px; box-shadow: var(--shadow); max-width: 360px; font-size: 14px; }
.toast.err { border-color: var(--red); }
.empty { text-align: center; padding: 48px 16px; color: var(--text-mute); display: grid; gap: 14px; justify-items: center; }
.skeleton { height: 120px; border-radius: var(--radius); background: linear-gradient(90deg, var(--line-soft), var(--bg-2), var(--line-soft)); background-size: 200% 100%; animation: sh 1.4s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.footnote { margin-top: 28px; font-size: 12px; color: var(--text-mute); border-top: 1px solid var(--line-soft); padding-top: 14px; }

@media (max-width: 820px) {
  .bar-row { grid-template-columns: 1fr 64px; }
  .bar-row .bar-track { grid-column: 1 / -1; order: 3; }
  .kv { grid-template-columns: 1fr; }
}

</style>

// Tiny DOM helpers. Text always goes in as text nodes, never as HTML.
function h(tag, attrs = {}, ...children) {
  const svgTags = ["svg", "path", "line", "rect", "circle", "g", "text", "polyline", "polygon", "title", "defs", "linearGradient", "stop"];
  const el = svgTags.includes(tag)
    ? document.createElementNS("http://www.w3.org/2000/svg", tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.setAttribute("class", v);
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else if (k === "html") throw new Error("html attribute is not allowed");
    else el.setAttribute(k, v === true ? "" : v);
  }
  append(el, children);
  return el;
}

function append(el, children) {
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

function mount(parent, ...children) {
  parent.replaceChildren();
  append(parent, children);
}

let toastTimer;
function toast(message, isError = false) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast" + (isError ? " err" : ""), role: "status" }, message);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 4200);
}

exports.h = h;
exports.mount = mount;
exports.toast = toast;

function drawStars(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = (canvas.width = innerWidth * dpr);
  const h = (canvas.height = innerHeight * dpr);
  const ctx = canvas.getContext("2d");
  let s = 20261114;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const n = Math.round((innerWidth * innerHeight) / 5200);
  for (let i = 0; i < n; i++) {
    const r = (rnd() < 0.06 ? 1.6 : 0.7 + rnd() * 0.5) * dpr;

    ctx.fillStyle = rnd() < 0.15 ? "#4fd1c5" : rnd() < 0.2 ? "#f2a33a" : "#e8edf3";

    ctx.arc(rnd() * w, rnd() * h, r, 0, 6.2832);
